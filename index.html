<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f7fb">
<title>Cambridge Prep — exam preparation</title>
<style>
:root{--ink:#17213a;--muted:#68738b;--line:#e2e7f0;--paper:#fff;--bg:#f6f7fb;--blue:#3858d6;--shadow:0 18px 55px #1a285214}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 8% 0%,#e9edff 0,transparent 34%),var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);min-height:100vh}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #8da0ff;outline-offset:3px}.shell{max-width:1100px;margin:auto;padding:26px 24px 48px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:58px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.04em}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--blue);color:white}.top-tag,.muted{color:var(--muted)}.hero{max-width:760px;margin-bottom:34px}.eyebrow{font-size:.76rem;text-transform:uppercase;letter-spacing:.15em;color:var(--blue);font-weight:800;margin:0 0 13px}.hero h1{font-size:clamp(2.4rem,6vw,4.4rem);line-height:1.03;letter-spacing:-.065em;margin:0 0 17px}.hero h1 span{color:var(--blue)}.hero p:last-child{font-size:1.07rem;line-height:1.7;color:var(--muted);max-width:630px;margin:0}.step{display:flex;align-items:center;gap:10px;margin:0 0 17px;color:var(--muted);font-size:.88rem}.step b{color:var(--ink)}.dot{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:white;border:1px solid var(--line);border-radius:22px;padding:25px;text-align:left;display:flex;flex-direction:column;min-height:215px;color:inherit;transition:.18s;box-shadow:0 2px 0 #17213a03}.card:hover{transform:translateY(-3px);border-color:#aab7f5;box-shadow:var(--shadow)}.cardhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:12px}.symbol{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:#e5ebff;font-size:1.2rem;font-weight:800}.symbol.green{background:#dff7ee}.symbol.peach{background:#fff0e5}.pill{font-size:.72rem;font-weight:800;padding:7px 10px;border-radius:99px;background:#f0f2f8;color:#59647b}.card h2{font-size:1.27rem;letter-spacing:-.035em;margin:0 0 9px}.card p{font-size:.93rem;line-height:1.6;color:var(--muted);margin:0 0 19px}.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:var(--blue);font-size:.9rem;font-weight:750}.panel{background:white;border:1px solid var(--line);border-radius:22px;padding:clamp(22px,4vw,36px);box-shadow:var(--shadow);max-width:850px}.panel h2{font-size:clamp(1.6rem,3vw,2.2rem);letter-spacing:-.05em;margin:0 0 10px}.intro{color:var(--muted);line-height:1.65;margin:0 0 25px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:25px}.primary,.secondary{border:0;border-radius:12px;padding:13px 18px;font-weight:750}.primary{background:var(--blue);color:white}.primary:hover{background:#2844b5}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#f0f2f8;color:var(--ink)}.choices{display:grid;gap:12px}.choice{display:flex;align-items:flex-start;gap:13px;border:1px solid var(--line);border-radius:14px;padding:16px}.choice input{margin-top:5px;accent-color:var(--blue)}.choice strong{display:block;margin-bottom:5px}.choice small{display:block;color:var(--muted);line-height:1.5;font-size:.88rem}.note{padding:15px 17px;background:#f3f5ff;border-radius:13px;color:#4d5b82;font-size:.9rem;line-height:1.55;margin-top:18px}.sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.section{border:1px solid var(--line);border-radius:12px;padding:13px;background:white;color:var(--ink);text-align:left}.section[aria-pressed=true]{border-color:var(--blue);background:#f1f3ff;color:var(--blue);font-weight:750}.footer{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);margin-top:54px;padding-top:20px;color:var(--muted);font-size:.82rem}
@media(max-width:650px){.shell{padding:18px 16px 34px}.topbar{margin-bottom:40px}.top-tag{display:none}.cards,.sections{grid-template-columns:1fr}.card{min-height:190px}.footer{flex-direction:column}.hero h1{font-size:2.75rem}}
</style></head>
<body><div class="shell"><header class="topbar"><div class="brand"><div class="mark">C</div><span>Cambridge Prep</span></div><div class="top-tag">Your preparation. Your pace.</div></header><main id="app" aria-live="polite"></main><footer class="footer"><span>Cambridge Prep · Navigation prototype</span><span>An independent study aid, not affiliated with Cambridge English.</span></footer></div>
<script>
const state={level:null,mode:null,sections:new Set(),currentPaper:0,remaining:0,running:false,timerId:null,started:false,breakRemaining:600,pausedScreen:null};
const app=document.getElementById('app');
const modes=[
{id:'exam',icon:'⏱',tone:'',title:'Exam Simulation',tag:'Real exam feel',desc:'Follow the official exam order and time limits. You can skip scheduled breaks.',foot:'Start exam simulation'},
{id:'sections',icon:'▤',tone:'peach',title:'Practice by Section',tag:'Choose papers',desc:'Choose the exam papers you want to practise.',foot:'Choose papers'}];
const examData={
B2:[
{id:'rue',name:'Reading & Use of English',minutes:75,display:'1 hour 15 minutes',parts:['Part 1 — Multiple-choice cloze','Part 2 — Open cloze','Part 3 — Word formation','Part 4 — Key word transformations','Part 5 — Multiple choice','Part 6 — Gapped text','Part 7 — Multiple matching']},
{id:'writing',name:'Writing',minutes:80,display:'1 hour 20 minutes',parts:['Part 1 — Essay','Part 2 — Article, email/letter, report or review']},
{id:'listening',name:'Listening',minutes:40,display:'About 40 minutes',parts:['Part 1 — Multiple choice','Part 2 — Sentence completion','Part 3 — Multiple matching','Part 4 — Multiple choice']},
{id:'speaking',name:'Speaking',minutes:14,display:'14 minutes per pair',parts:['Part 1 — Interview','Part 2 — Long turn','Part 3 — Collaborative task','Part 4 — Discussion']}
],
C1:[
{id:'rue',name:'Reading & Use of English',minutes:90,display:'1 hour 30 minutes',parts:['Part 1 — Multiple-choice cloze','Part 2 — Open cloze','Part 3 — Word formation','Part 4 — Key word transformations','Part 5 — Multiple choice','Part 6 — Cross-text multiple matching','Part 7 — Gapped text','Part 8 — Multiple matching']},
{id:'writing',name:'Writing',minutes:90,display:'1 hour 30 minutes',parts:['Part 1 — Essay','Part 2 — Proposal, report, review or email/letter']},
{id:'listening',name:'Listening',minutes:40,display:'About 40 minutes',parts:['Part 1 — Multiple choice','Part 2 — Sentence completion','Part 3 — Multiple choice','Part 4 — Multiple matching']},
{id:'speaking',name:'Speaking',minutes:15,display:'15 minutes per pair',parts:['Part 1 — Interview','Part 2 — Long turn','Part 3 — Collaborative task','Part 4 — Discussion']}
]};
function papers(){return examData[state.level].filter(p=>state.mode!=='sections'||state.sections.has(p.name))}
function stopTimer(){if(state.timerId)clearInterval(state.timerId);state.timerId=null;state.running=false}
function renderHome(){stopTimer();state.started=false;app.innerHTML='<section class="hero"><p class="eyebrow">Prepare with purpose</p><h1>Your next level of English<br>starts <span>here.</span></h1><p>Choose your Cambridge exam and the preparation style that works for you. Get started with a clear plan and learn at your own pace.</p></section><div class="step"><span class="dot">1</span><b>Choose your exam level</b></div><div class="cards"><button class="card" data-level="B2"><div class="cardhead"><span class="symbol">B2</span><span class="pill">Upper-intermediate</span></div><h2>B2 First (FCE)</h2><p>Show that you can use English confidently in everyday situations, study and work.</p><div class="foot"><span>Choose B2 First</span><span>↗</span></div></button><button class="card" data-level="C1"><div class="cardhead"><span class="symbol">C1</span><span class="pill">Advanced</span></div><h2>C1 Advanced (CAE)</h2><p>Demonstrate advanced English skills for demanding academic and professional situations.</p><div class="foot"><span>Choose C1 Advanced</span><span>↗</span></div></button></div>';app.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{state.level=b.dataset.level;renderModes()})}
function renderModes(){stopTimer();app.innerHTML='<section class="hero"><p class="eyebrow">Step 2 · '+(state.level==='B2'?'B2 First (FCE)':'C1 Advanced (CAE)')+'</p><h1>How would you like to <span>practise?</span></h1><p>Choose a mode. You can come back and change it at any time.</p></section><div class="cards">'+modes.map(m=>'<button class="card" data-mode="'+m.id+'"><div class="cardhead"><span class="symbol '+m.tone+'">'+m.icon+'</span><span class="pill">'+m.tag+'</span></div><h2>'+m.title+'</h2><p>'+m.desc+'</p><div class="foot"><span>'+m.foot+'</span><span>↗</span></div></button>').join('')+'</div><div class="actions"><button class="secondary" id="back">← Back to exam level</button></div>';app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;state.sections.clear();renderDetail()});document.getElementById('back').onclick=renderHome}
function frame(title,subtitle,body,actions){app.innerHTML='<div class="step"><span class="dot">3</span><b>'+title+'</b></div><section class="panel"><h2>'+title+'</h2><p class="intro">'+subtitle+'</p>'+body+actions+'</section>'}
function renderDetail(){const mode=modes.find(m=>m.id===state.mode);let body='';
if(state.mode==='exam')body='<div class="note">After each paper, a 10-minute break timer will appear. You can skip that break whenever you are ready to continue.</div><div class="note">Each paper has its own countdown timer and list of parts. No exam questions are included.</div>';
else body='<p style="margin:0 0 14px;font-weight:750">Choose the papers you want to practise:</p><div class="sections">'+examData[state.level].map(p=>'<button class="section" data-section="'+p.name+'" aria-pressed="'+state.sections.has(p.name)+'">'+(state.sections.has(p.name)?'✓ ':'')+p.name+'<br><small style="color:var(--muted)">'+p.display+'</small></button>').join('')+'</div><div class="note">Choose one or more papers. Each selected paper includes its part names and a countdown timer.</div>';
frame(mode.title,'Selected exam: '+(state.level==='B2'?'B2 First (FCE)':'C1 Advanced (CAE)'),body,'<div class="actions"><button class="primary" id="continue" '+(state.mode==='sections'&&!state.sections.size?'disabled':'')+'>'+(state.mode==='sections'?'Confirm selection':'Continue')+' →</button><button class="secondary" id="back">← Back to modes</button></div>');
app.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{const s=b.dataset.section;state.sections.has(s)?state.sections.delete(s):state.sections.add(s);renderDetail()});document.getElementById('back').onclick=renderModes;document.getElementById('continue').onclick=()=>{state.currentPaper=0;state.remaining=0;state.breakRemaining=600;renderSummary(mode)}}
function renderSummary(mode){let selected=papers();let body='<div class="choices"><div class="choice"><span class="symbol">'+state.level+'</span><span><strong>'+(state.level==='B2'?'B2 First (FCE)':'C1 Advanced (CAE)')+'</strong><small>Selected exam level</small></span></div><div class="choice"><span class="symbol green">'+mode.icon+'</span><span><strong>'+mode.title+'</strong><small>Selected practice mode</small></span></div></div><div class="choices" style="margin-top:16px">'+selected.map(p=>'<div class="choice"><span class="symbol">⏱</span><span><strong>'+p.name+'</strong><small>'+p.display+' · '+p.parts.length+' parts</small></span></div>').join('')+'</div><div class="note">Speaking durations are per pair. Listening duration is approximate. Timers are for practice guidance; actual exam-day arrangements may vary.</div>';
frame('Your practice is ready','Review your papers before starting.',body,'<div class="actions"><button class="primary" id="start">Start practice →</button><button class="secondary" id="change">Change setup</button><button class="secondary" id="home">Back to start</button></div>');
document.getElementById('start').onclick=()=>{state.currentPaper=0;state.remaining=selected[0].minutes*60;state.started=true;renderPractice()};document.getElementById('change').onclick=renderDetail;document.getElementById('home').onclick=renderHome}
function fmt(sec){const n=Math.max(0,sec);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function renderPractice(){stopTimer();const list=papers();if(!list.length){renderDetail();return}if(state.currentPaper>=list.length)state.currentPaper=list.length-1;const p=list[state.currentPaper];if(!state.remaining)state.remaining=p.minutes*60;
const nav=list.map((x,i)=>'<button class="section" data-paper="'+i+'" aria-pressed="'+(i===state.currentPaper)+'">'+(i+1)+'. '+x.name+'<br><small style="color:var(--muted)">'+x.display+'</small></button>').join('');
const partList='<ol style="line-height:1.9;padding-left:24px">'+p.parts.map(x=>'<li>'+x+'</li>').join('')+'</ol>';
app.innerHTML='<div class="step"><span class="dot">4</span><b>'+modes.find(m=>m.id===state.mode).title+'</b></div><section class="panel"><p class="eyebrow">'+(state.level==='B2'?'B2 First (FCE)':'C1 Advanced (CAE)')+' · PAPER '+(state.currentPaper+1)+' OF '+list.length+'</p><h2>'+p.name+'</h2><p class="intro">Official time allowance: '+p.display+'. The list below shows the paper parts only; there are no questions yet.</p><div class="sections">'+nav+'</div><div style="text-align:center;background:#f5f6fb;border-radius:18px;padding:24px;margin:22px 0"><div class="muted" style="font-size:.85rem;margin-bottom:8px">TIME REMAINING</div><div id="clock" style="font-size:clamp(2.8rem,9vw,4.5rem);font-weight:800;letter-spacing:-.06em;font-variant-numeric:tabular-nums">'+fmt(state.remaining)+'</div><div class="actions" style="justify-content:center"><button class="primary" id="toggle">'+(state.running?'Pause timer':'Start timer')+'</button><button class="secondary" id="reset">Reset timer</button></div><p id="timerstatus" class="muted" style="font-size:.85rem;margin:12px 0 0">'+(state.remaining===0?'Time is up.':state.running?'Timer running':'Timer not started')+'</p></div><h3 style="margin-bottom:8px">Paper parts</h3>'+partList+'<div class="note">Speaking is timed per pair; Listening is approximate. The timer is a study aid and may not match every test-centre arrangement.</div><div class="actions"><button class="secondary" id="pauseexam">Pause entire exam</button><button class="secondary" id="back">← Setup summary</button><button class="primary" id="next">'+(state.currentPaper===list.length-1?'Finish practice':'Next paper →')+'</button></div></section>';
app.querySelectorAll('[data-paper]').forEach(b=>b.onclick=()=>{stopTimer();state.currentPaper=Number(b.dataset.paper);state.remaining=list[state.currentPaper].minutes*60;renderPractice()});
document.getElementById('toggle').onclick=()=>{if(state.running){stopTimer();renderPractice();return}if(state.remaining<=0)return;state.running=true;document.getElementById('toggle').textContent='Pause timer';document.getElementById('timerstatus').textContent='Timer running';state.timerId=setInterval(()=>{state.remaining--;const clock=document.getElementById('clock');if(clock)clock.textContent=fmt(state.remaining);if(state.remaining<=0){stopTimer();if(state.mode==='exam'&&state.currentPaper<papers().length-1){renderBreak();return}const status=document.getElementById('timerstatus');if(status)status.textContent='Time is up.';const toggle=document.getElementById('toggle');if(toggle){toggle.textContent='Time is up';toggle.disabled=true}}},1000)};
document.getElementById('pauseexam').onclick=()=>pauseExam('paper');document.getElementById('reset').onclick=()=>{stopTimer();state.remaining=p.minutes*60;renderPractice()};document.getElementById('back').onclick=()=>{stopTimer();renderSummary(modes.find(m=>m.id===state.mode))};document.getElementById('next').onclick=()=>{stopTimer();if(state.currentPaper<list.length-1){if(state.mode==='exam'){renderBreak()}else{state.currentPaper++;state.remaining=list[state.currentPaper].minutes*60;renderPractice()}}else{state.started=false;renderComplete()}};
if(state.remaining>0)document.getElementById('toggle').click();
}
function renderBreak(reset=true){stopTimer();if(reset)state.breakRemaining=600;app.innerHTML='<div class="step"><span class="dot">B</span><b>Scheduled break</b></div><section class="panel"><p class="eyebrow">EXAM SIMULATION · BREAK</p><h2>Take a break</h2><p class="intro">The previous paper is complete. A 10-minute break is available before the next paper. Skip it whenever you are ready.</p><div style="text-align:center;background:#f5f6fb;border-radius:18px;padding:24px;margin:22px 0"><div class="muted" style="font-size:.85rem;margin-bottom:8px">BREAK TIME REMAINING</div><div id="breakclock" style="font-size:clamp(2.8rem,9vw,4.5rem);font-weight:800;letter-spacing:-.06em;font-variant-numeric:tabular-nums">10:00</div><p id="breakstatus" class="muted">Break timer running</p></div><div class="actions"><button class="primary" id="skipbreak">Skip break and continue →</button><button class="secondary" id="pausebreak">Pause break timer</button><button class="secondary" id="pauseexam">Pause entire exam</button></div></section>';
const next=()=>{stopTimer();state.currentPaper++;state.remaining=papers()[state.currentPaper].minutes*60;renderPractice()};
document.getElementById('skipbreak').onclick=next;
document.getElementById('pauseexam').onclick=()=>pauseExam('break');
document.getElementById('pausebreak').onclick=()=>{if(state.running){stopTimer();document.getElementById('pausebreak').textContent='Resume break timer';document.getElementById('breakstatus').textContent='Break timer paused'}else{if(state.breakRemaining<=0)return;state.running=true;document.getElementById('pausebreak').textContent='Pause break timer';document.getElementById('breakstatus').textContent='Break timer running';startBreakClock()}};
function startBreakClock(){state.timerId=setInterval(()=>{state.breakRemaining--;const clock=document.getElementById('breakclock');if(clock)clock.textContent=fmt(state.breakRemaining);if(state.breakRemaining<=0){stopTimer();next()}},1000)}
state.running=true;startBreakClock();
}
function pauseExam(screen){stopTimer();state.pausedScreen=screen;app.innerHTML='<div class="step"><span class="dot">Ⅱ</span><b>Exam paused</b></div><section class="panel"><p class="eyebrow">PAUSED</p><h2>Your exam is paused</h2><p class="intro">Your current paper and remaining time have been preserved. Resume when you are ready.</p><div class="actions"><button class="primary" id="resumeexam">Resume exam →</button><button class="secondary" id="endpaused">End practice</button></div></section>';document.getElementById('resumeexam').onclick=()=>{const screen=state.pausedScreen;state.pausedScreen=null;if(screen==='break'){renderBreak(false)}else{renderPractice()}};document.getElementById('endpaused').onclick=()=>{state.started=false;renderComplete()}}
function renderComplete(){frame('Practice complete','You have reached the end of your selected papers.','<div class="note">This prototype includes paper names, part names and countdown timers. Exam questions and saved results have not been added.</div>','<div class="actions"><button class="primary" id="again">Back to summary</button><button class="secondary" id="home">Back to start</button></div>');document.getElementById('again').onclick=()=>{state.currentPaper=0;state.remaining=0;renderSummary(modes.find(m=>m.id===state.mode))};document.getElementById('home').onclick=renderHome}
renderHome();
</script></body></html>
