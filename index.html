/* Cambridge Digital-inspired exam interface */
body.exam-active .shell{max-width:none;padding:0 24px 40px}body.exam-active .topbar,body.exam-active .footer{display:none}.exam-header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:12px 20px;background:#fff;border:1px solid #d9dee5;border-radius:0;margin:-26px -24px 20px;box-shadow:0 2px 5px #14213a0a}
.exam-brand,.exam-identity,.exam-tools{display:flex;align-items:center;gap:14px}.exam-brand{font-family:Georgia,serif;font-size:1.05rem;color:#202a3b;white-space:nowrap}.exam-crest{font-size:1.55rem;color:#8a1c2b}.exam-product{font:600 .95rem Inter,system-ui,sans-serif;border-left:1px solid #d5dbe3;padding-left:18px}.exam-identity{border-left:1px solid #d5dbe3;padding-left:18px;color:#27344b;font-size:.9rem}.exam-identity small,.exam-time small{display:block;color:#68758a;font-size:.75rem;margin-top:2px}.exam-time{display:flex;align-items:center;gap:9px;border-left:1px solid #d5dbe3;padding-left:18px;font-variant-numeric:tabular-nums}.exam-time strong{font-size:1rem}.exam-tools{margin-left:auto}.exam-icon{border:0;background:transparent;color:#25344b;width:38px;height:38px;border-radius:5px;font-size:1.3rem;display:grid;place-items:center;position:relative}.exam-icon:hover{background:#eef2f6}.message-dot{position:absolute;width:7px;height:7px;border-radius:50%;background:#1685b8;right:7px;top:6px}.exam-menu{position:absolute;right:16px;top:calc(100% + 5px);width:min(340px,calc(100vw - 32px));background:white;border:1px solid #d7dde5;border-radius:4px;box-shadow:0 8px 24px #14213a26;padding:8px;z-index:30}.exam-menu button{width:100%;border:0;background:white;text-align:left;padding:14px 12px;color:#27344b;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e6e9ee}.exam-menu button:last-child{border-bottom:0}.exam-menu button:hover{background:#f2f5f8}.exam-submenu{padding:7px 10px 12px;border-bottom:1px solid #e6e9ee}.exam-submenu button{padding:10px;border:0;border-radius:3px}.exam-submenu button[aria-pressed=true]{background:#eaf1f8;font-weight:700}.exam-message{position:absolute;right:60px;top:calc(100% + 5px);width:min(310px,calc(100vw - 32px));background:#fff;border:1px solid #d7dde5;padding:18px;box-shadow:0 8px 24px #14213a26;z-index:30}.exam-workspace{background:#fff;border:1px solid #dfe3e8;border-radius:3px;padding:clamp(1 /* Interactive Cambridge-style task workspace */
.task-intro{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.task-instruction{background:#f4f6f8;border:1px solid #e0e4e9;padding:14px 16px;margin:14px 0 20px;color:#344154;line-height:1.55}.task-reading{font-family:Georgia,serif;font-size:1.06rem;line-height:1.85;max-width:900px;color:#273449}.task-question{padding:15px 0;border-bottom:1px solid #e4e8ed;display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px}.task-number{border:1px solid #aeb8c4;border-radius:3px;width:28px;height:28px;display:grid;place-items:center;font-weight:700;font-size:.85rem}.task-question p{margin:0 0 10px;line-height:1.55}.task-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.task-option{border:1px solid #d9dfe6;background:#fff;text-align:left;padding:10px 12px;border-radius:3px;color:#26354a}.task-option[aria-pressed=true]{border-color:#087b96;background:#eaf5f7;color:#075e73;font-weight:700}.task-answer{width:min(100%,420px);padding:10px 12px;border:1px solid #bdc6d1;border-radius:3px;font:inherit}.task-passage{white-space:pre-line;line-height:1.8;color:#26354a;margin:18px 0}.task-passage .gap{display:inline-block;min-width:76px;border-bottom:1px solid #526174;text-align:center;font-weight:700}.task-bottom-nav{position:sticky;bottom:0;z-index:15;display:flex;align-items:stretch;gap:0;overflow-x:auto;background:#f7f8fa;border:1px solid #d8dde3;margin:24px -30px -30px;padding:0 8px;box-shadow:0 -3px 12px #17213a0a}.task-tab{flex:1;min-width:112px;position:relative;border:0;border-right:1px solid #d8dde3;background:transparent;padding:12px 10px 10px;color:#3b4657;text-align:center;font-size:.86rem;white-space:nowrap}.task-tab[aria-current=step]{background:#fff;border-top:3px solid #087b96;padding-top:9px;font-weight:750}.task-tab.done:before{content:'✓';margin-right:6px;color:#397b58}.task-tab small{display:block;color:#6a7482;font-size:.73rem;margin-top:4px}.task-tab .bookmark{position:absolute;right:9px;top:3  return {id:`b2-rue-original-${String(i+1).padStart(2,'0')}`,title:`B2 Reading and Use of English Candidate Test ${i+1}`,status:'candidate',parts:{

function fmt(sec){const n=Math.max(0,sec);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function partCount(paper,index){
if(paper.id==='rue')return [8,8,8,6,6,6,10][index];
if(paper.id==='writing')return index===0?1:3;
if(paper.id==='listening')return [8,10,5,7][index];
return [1,2,1,2][index];
}

function makeQuestion(paper,index,q){
const n=q+1, key=taskKey(state.currentPaper,index,q), saved=answerValue(key);
const rue=[
{instruction:'Read the text and choose the word or phrase which best fits each gap. Choose A, B, C or D.',title:'A new perspective on city gardens',text:'When a group of neighbours in Westford decided to turn an empty piece of land into a garden, few people expected it to become such a success. At first, they had to '+(q===0?'overcome':'deal with')+' several practical difficulties. The ground was poor, and there was little money available. However, everyone was determined to make the project work. Local businesses were asked to '+(q%2?'provide':'offer')+' tools and materials, while volunteers gave up their weekends.' ,options:['A · achieve','B · overcome','C · succeed','D · manage']},
{instruction:'Read the text. Think of the one word which best fits each gap.',title:'Learning from experience',text:'People often say that experience is the best teacher, and there is certainly some truth '+(q%2?'in':'to')+' this idea. When we try something new, we learn not only '+(q%2?'what':'how')+' to do it, but also why certain approaches are more effective. The important thing is to reflect '+(q%2?'on':'in')+' what happened afterwards.'},
{instruction:'Use the word in capitals at the end of the line to form a word that fits the gap.',title:'The value of volunteering',text:'Volunteering can be an extremely rewarding experience. It gives people the '+(q%2?'opportunity':'chance')+' to develop useful skills and make a real difference.',prompt:['SUCCESS','CREATE','CONFIDENT','POSSIBLE','COMMUNICATE','DEPEND','BENEFIT','FRIEND'][q]},
{instruction:'Complete the second sentence so that it has a similar meaning to the first sentence. Use the key word. Do not change the key word. Use between two and five words.',title:'Sentence transformation',first:['I last visited the museum two years ago.','The journey took longer than we expected.','“You should book your tickets early,” Mia said.','It was such a difficult task that nobody finished it.','They are repairing the bridge this week.','I regret not joining the photography club.'][q],key:['SINCE','AS','ADVISED','TOO','BEING','WISH'][q],second:['I have not visited the museum ______ two years.','The journey was not ______ we expected.','Mia ______ our tickets early.','The task was ______ anybody to finish.','The bridge ______ repaired this week.','I ______ the photography club.'][q]},
{instruction:'Read the text and choose the answer (A, B, C or D) which you think fits best according to the text.',title:'Why we started cycling to work',text:'When our office introduced a cycle-to-work scheme, I was sceptical. I had always thought cycling in the city would be stressful, and I worried about arriving at work tired. But after trying it for a week, I realised that the journey was often quicker than taking the bus. More importantly, I began to enjoy the time outdoors before a busy day. The scheme did not solve every problem: finding a safe place to leave my bike was still difficult. Even so, I now cycle most days.' ,options:['A · The writer was immediately enthusiastic.','B · The writer found cycling slower than the bus.','C · The writer changed their opinion after trying it.','D · The scheme provided secure bicycle storage.']},
{instruction:'Six sentences have been removed from the text. Choose from the sentences A–G the one which fits each gap. There is one extra sentence.',title:'A place to concentrate',text:'The library had been part of the town for more than a century. [1] It was therefore a surprise when the council announced plans to modernise it. [2] The changes were not simply about appearance. [3] Some visitors wanted quiet study areas, while others needed spaces for group work. [4] The final design attempted to balance both needs.' ,options:['A · The building was showing clear signs of age.','B · This meant that everyone had exactly the same opinion.','C · The architects spent time listening to local residents.','D · As a result, the project was cancelled.','E · Technology also had to be considered.','F · It had always been a popular meeting place.','G · The library was moved to another town.']},
{instruction:'You are going to read four short texts. For questions 1–10, choose from the people (A–D). The people may be chosen more than once.',title:'Four people describe learning a skill',text:'A — I joined a cooking course because I wanted to become more independent. The most useful part was learning how to plan meals without spending too much.\\n\\nB — I started running with a local group. I was nervous at first, but having other people around helped me keep going.\\n\\nC — I took up photography after receiving a camera as a present. I enjoy experimenting, although I still find the technical side challenging.\\n\\nD — I learned basic carpentry from my grandfather. It takes patience, but I like being able to repair things instead of replacing them.',options:['A','B','C','D']}
];
const d=rue[index],questionTexts=[
'Which option best completes the gap in the text?','Which word is missing from the sentence?','What form of the prompt word is needed?','Complete the sentence using the key word.','What does the writer suggest about the experience?','Which sentence fits the gap?','Which person mentions this experience?'
];
let prompt=d.text;
if(index===0)prompt+=' The organisers also made sure that the garden was open '+(q%2?'to':'for')+' everyone in the neighbourhood.';
if(index===1)prompt+=' This is '+(q%2?'because':'why')+' it is worth taking time to think carefully about our decisions.';
if(index===2)prompt+=' Many participants are surprised by how '+(q%2?'quick':'quickly')+' their confidence grows.';
if(index===0||index===4||index===5||index===6){
const opts=index===0?['A · put','B · set','C · take','D · make']:d.options;
return '<div class="task-question"><span class="task-number">'+n+'</span><div><p>'+questionTexts[index]+'</p><div class="task-options">'+opts.map((o,i)=>'<button class="task-option" data-answer="'+key+'" data-value="'+String.fromCharCode(65+i)+'" aria-pressed="'+(saved===String.fromCharCode(65+i))+'">'+o+'</button>').join('')+'</div></div></div>';
}
if(index===1)return '<div class="task-question"><span class="task-number">'+n+'</span><div><p>'+prompt+'</p><input class="task-answer" data-answer="'+key+'" value="'+saved.replace(/"/g,'&quot;')+'" placeholder="Type one word"></div></div>';
if(index===2)return '<div class="task-question"><span class="task-number">'+n+'</span><div><p>'+prompt+' <strong>('+d.prompt+')</strong></p><input class="task-answer" data-answer="'+key+'" value="'+saved.replace(/"/g,'&quot;')+'" placeholder="Your answer"></div></div>';
if(index===3)return '<div class="task-question"><span class="task-number">'+n+'</span><div><p>'+d.first+'<br><strong>Key word: '+d.key+'</strong></p><p>'+d.second+'</p><input class="task-answer" data-answer="'+key+'" value="'+saved.replace(/"/g,'&quot;')+'" placeholder="Complete the sentence"></div></div>';

if(paper.id==='listening'){
const options=['The speaker was surprised by the result.','The speaker recommends planning ahead.','The main difficulty was lack of time.'];
if(index===1)return '<div class="task-question"><span class="task-number">'+n+'</span><div><p>Complete the sentence with the information you hear.</p><p>The community project was first organised in the year ______.</p><input class="task-answer" data-answer="'+key+'" value="'+saved+'" placeholder="Your answer"></div></div>';

}
const prompts=[
'Compare the two situations. What might the people enjoy about these activities?',
'Describe a time when you had to learn something new. What helped you?',
'Talk about the advantages and disadvantages of studying with other people.',
'Why do people choose to spend their free time learning new skills?'
];
return '<div class="task-question"><span class="task-number">'+n+'</span><div><p><strong>Speaking prompt</strong></p><div class="speaking-prompt">'+prompts[(index+q)%prompts.length]+'</div><textarea class="writing-response" style="min-height:110px" data-answer="'+key+'" placeholder="Make notes for your response...">'+saved+'</textarea></div></div>';
}
function generatedParagraph(index){
const key=state.currentPaper+'-'+index;
if(state.generatedText[key])return state.generatedText[key];
const subjects=['The organisers','Several local residents','A small team of volunteers','The project manager','Visitors from nearby towns','The research group'];
const actions=['noticed an unexpected improvement','decided to try a different approach','shared their experiences with others','collected useful feedback','made a series of practical changes','discovered a more effective solution'];
const endings=['over the following weeks.','after a great deal of discussion.','which helped the project move forward.','despite a few early difficulties.','and the results were encouraging.','without needing additional resources.'];
const sentence=subjects[Math.floor(Math.random()*subjects.length)]+' '+actions[Math.floor(Math.random()*actions.length)]+' '+endings[Math.floor(Math.random()*endings.length)];
state.generatedText[key]=sentence;

app.innerHTML=examHeader(fmt(state.remaining))+'<main class="exam-content"><section class="exam-workspace">'+renderTaskBody(p,partIndex)+'</section></main><nav class="task-bottom-dock"><div class="task-tabs-row">'+tabs+'</div><div class="task-question-row"><div class="task-question-count">Part '+(partIndex+1)+'</div><div class="task-question-numbers">'+nums+'</div><div class="task-arrows"><button class="dock-arrow" id="prevPart" '+(partIndex===0?'disabled':'')+'>←</button><button class="dock-arrow next" id="nextPart">➜</button></div></div></nav>';
if(p.id==='rue'&&partIndex===2){requestAnimationFrame(()=>{syncPartThreeStems();requestAnimationFrame(syncPartThreeStems)})}
const startListening=app.querySelector('#startListening');if(startListening)startListening.onclick=()=>{state.listeningStarted=true;renderPractice()};
const volume=app.querySelector('#listeningVolume');if(volume)volume.oninput=()=>{state.listeningVolume=+volume.value};
app.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>{state.partIndex=+b.dataset.part;state.questionIndex=0;renderPractice()});
app.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{state.questionIndex=+b.dataset.jump;if(p.id==='writing'&&partIndex===1)state.writingQuestion=state.questionIndex;renderPractice()});
app.querySelectorAll('[data-answer]').forEach(el=>el.addEventListener(el.type==='radio'||el.tagName==='SELECT'?'change':'input',()=>{setAnswer(el.dataset.answer,el.value);if(el.classList.contains('writing-selection')){if(el.value==='Yes'){[0,1,2].forEach(i=>{if(i!==state.writingQuestion)setAnswer(taskKey(state.currentPaper,1,i)+'-selection','No')})}const count=[0,1,2].filter(i=>answerValue(taskKey(state.currentPaper,1,i)+'-selection')==='Yes').length;const small=app.querySelector('.writing-selection-bar small');if(small)small.textContent=count+' of 1 questions selected.';const check=app.querySelector('.writing-selection-check');if(check)check.textContent=el.value==='Yes'?'✔':'?'}const counter=app.querySelector('[data-count="'+el.dataset.answer+'"]');if(counter&&el.tagName==='TEXTAREA'){const words=el.value.trim()?el.value.trim().split(/\s+/).length:0;counter.textContent='Words: '+words}const j=app.querySelector('[data-jump="'+el.dataset.question+'"]');if(j)j.classList.toggle('answered',!!el.value.trim())}));
app.querySelectorAll('[data-bookmark-question]').forEach(b=>b.onclick=()=>{const q=+b.dataset.bookmarkQuestion,k=taskKey(state.currentPaper,partIndex,q);state.bookmarks[k]=!state.bookmarks[k];b.classList.toggle('marked',!!state.bookmarks[k]);const j=app.querySelector('[data-jump="'+q+'"]');if(j)j.classList.toggle('flagged',!!state.bookmarks[k])});

app.querySelectorAll('[data-gap-value]').forEach(b=>b.onclick=()=>{const q=+b.dataset.gapValue,k=taskKey(state.currentPaper,partIndex,q),anchor=app.querySelector('[data-gap-open="'+q+'"]'),clear=app.querySelector('[data-gap-clear="'+q+'"]');setAnswer(k,b.dataset.value);anchor.textContent=b.textContent;clear.hidden=false;if(window.closeRueGapMenu)window.closeRueGapMenu(document.getElementById('gapMenu'+q));const j=app.querySelector('[data-jump="'+q+'"]');if(j)j.classList.add('answered')});
app.querySelectorAll('[data-gap-clear]').forEach(b=>b.onclick=()=>{const q=+b.dataset.gapClear;setAnswer(taskKey(state.currentPaper,partIndex,q),'');app.querySelector('[data-gap-open="'+q+'"]').textContent='Question '+(first+q);if(window.closeRueGapMenu)window.closeRueGapMenu(document.getElementById('gapMenu'+q));const j=app.querySelector('[data-jump="'+q+'"]');if(j)j.classList.remove('answered');const target=app.querySelector('[data-gap-open="'+q+'"]');if(target)target.focus()});
let draggedSentence='';
let selectedSentence='';
app.querySelectorAll('[data-sentence]').forEach(b=>{
 b.addEventListener('click',()=>{if(b.disabled)return;app.querySelectorAll('[data-sentence]').forEach(x=>x.classList.remove('selected'));selectedSentence=selectedSentence===b.dataset.sentence?'':b.dataset.sentence;if(selectedSentence)b.classList.add('selected');});
 b.addEventListener('dragstart',e=>{if(b.disabled)return;draggedSentence=b.dataset.sentence;e.dataTransfer.setData('text/plain',draggedSentence);e.dataTransfer.effectAllowed='move';b.classList.add('dragging')});
 b.addEventListener('dragend',()=>b.classList.remove('dragging'));
});
function insertSentence(el,letter){if(!/^[A-G]$/.test(letter))return;const q=+el.dataset.dropGap;const k=taskKey(state.currentPaper,partIndex,q);const sentence=app.querySelector('[data-sentence="'+letter+'"]');if(!sentence||sentence.disabled)return;setAnswer(k,letter);el.textContent=letter+'. '+sentence.textContent.slice(3);el.classList.add('filled');sentence.classList.add('used');sentence.disabled=true;sentence.draggable=false;selectedSentence='';draggedSentence='';app.querySelectorAll('[data-sentence]').forEach(x=>x.classList.remove('selected'));}
function clearSentence(el){const q=+el.dataset.dropGap;const k=taskKey(state.currentPaper,partIndex,q);const letter=answerValue(k);if(letter){const sentence=app.querySelector('[data-sentence="'+letter+'"]');if(sentence){sentence.classList.remove('used');sentence.disabled=false;sentence.draggable=true;}}setAnswer(k,'');el.textContent='['+(first+q)+']';el.classList.remove('filled');}
app.querySelectorAll('[data-drop-gap]').forEach(el=>{
 el.addEventListener('click',()=>{if(el.classList.contains('filled'))clearSentence(el);else if(selectedSentence)insertSentence(el,selectedSentence);});
 el.addEventListener('dragover',e=>{if(draggedSentence||e.dataTransfer.types.includes('text/plain')){e.preventDefault();e.dataTransfer.dropEffect='move';el.classList.add('drop-target')}});
 el.addEventListener('dragleave',()=>el.classList.remove('drop-target'));
 el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('drop-target');const letter=e.dataTransfer.getData('text/plain')||draggedSentence;if(!/^[A-G]$/.test(letter))return;insertSentence(el,letter);const q=+el.dataset.dropGap;const status=app.querySelector('.sentence-status');if(status)status.textContent='Sentence '+letter+' inserted into gap '+(first+q)+'.';const jump=app.querySelector('[data-jump="'+q+'"]');if(jump)jump.classList.add('answered')});
});

const divider=app.querySelector('#splitDivider');if(divider){const splitTask=app.querySelector('.split-task');const limits=()=>{if(innerWidth<=700)return [35,65];const w=splitTask.getBoundingClientRect().width,d=36,minPx=Math.min(280,(w-d)/2);return [Math.max(30,minPx/(w-d)*100),Math.min(70,100-minPx/(w-d)*100)]};const set=v=>{const [lo,hi]=limits();v=Math.max(lo,Math.min(hi,v));state.splitWidths=state.splitWidths||{};state.splitWidths[partIndex]=v;splitTask.style.setProperty('--left-width',v+'%');divider.setAttribute('aria-valuenow',String(Math.round(v)));};set(state.splitWidths?.[partIndex]||50);let dragging=false;divider.addEventListener('pointerdown',e=>{dragging=true;document.body.classList.add('split-dragging');divider.setPointerCapture(e.pointerId);e.preventDefault()});divider.addEventListener('pointermove',e=>{if(!dragging)return;const r=splitTask.getBoundingClientRect();set((e.clientX-r.left)/r.width*100)});const stop=e=>{if(!dragging)return;dragging=false;document.body.classList.remove('split-dragging');try{divider.releasePointerCapture(e.pointerId)}catch(_){}};divider.addEventListener('pointerup',stop);divider.addEventListener('pointercancel',stop);divider.addEventListener('dblclick',()=>set(50));divider.addEventListener('keydown',e=>{const now=state.splitWidths?.[partIndex]||50;if(e.key==='ArrowLeft'){e.preventDefault();set(now-2)}if(e.key==='ArrowRight'){e.preventDefault();set(now+2)}if(e.key==='Home'){e.preventDefault();set(50)}})}
function goNextPaper(skipBreak){if(state.currentPaper<list.length-1){if(!skipBreak&&state.mode==='exam'){renderBreak(true)}else{state.currentPaper++;state.partIndex=0;state.questionIndex=0;state.remaining=list[state.currentPaper].minutes*60;renderPractice()}}else renderComplete()}
document.getElementById('prevPart').onclick=()=>{if(state.questionIndex>0){state.questionIndex--;if(p.id==='writing'&&partIndex===1)state.writingQuestion=state.questionIndex;renderPractice()}else if(partIndex>0){state.partIndex--;state.questionIndex=partCount(p,state.partIndex)-1;if(p.id==='writing'&&state.partIndex===1)state.writingQuestion=state.questionIndex;renderPractice()}};
document.getElementById('nextPart').onclick=()=>{if(state.questionIndex<count-1){state.questionIndex++;if(p.id==='writing'&&partIndex===1)state.writingQuestion=state.questionIndex;renderPractice()}else if(partIndex<p.parts.length-1){state.partIndex++;state.questionIndex=0;renderPractice()}else goNextPaper(false)};

const activeTarget=app.querySelector('[data-gap-open="'+state.questionIndex+'"]')||app.querySelector('[data-question="'+state.questionIndex+'"]')||app.querySelector('[data-answer="'+taskKey(state.currentPaper,partIndex,state.questionIndex)+'"]');
if(activeTarget){const block=activeTarget.closest('.mc-question,.listening-completion,.question-row,.writing-task')||activeTarget;setTimeout(()=>{block.scrollIntoView({block:'center',behavior:'smooth'});if(!(p.id==='rue'&&partIndex===0)&&typeof activeTarget.focus==='function'){activeTarget.focus()}},0)}

wireExamHeader();if(state.remaining>0){state.running=true;state.timerId=setInterval(()=>{state.remaining--;const el=document.getElementById('headerClock');if(el)el.textContent=fmt(state.remaining);if(state.remaining<=0)stopTimer()},1000)}
}
function renderBreak(reset=true){document.body.classList.add('exam-active');stopTimer();if(reset)state.breakRemaining=600;app.innerHTML=examHeader(fmt(state.breakRemaining),'Break time remaining')+'<div class="step"><span class="dot">B</span><b>Scheduled break</b></div><section class="panel exam-workspace"><p class="eyebrow">EXAM SIMULATION · BREAK</p><h2>Take a break</h2><p class="intro">The previous paper is complete. A 10-minute break is available before the next paper. Skip it whenever you are ready.</p><div style="text-align:center;background:#f5f6fb;border-radius:18px;padding:24px;margin:22px 0"><div class="muted" style="font-size:.85rem;margin-bottom:8px">BREAK TIME REMAINING</div><div id="breakclock" style="font-size:clamp(2.8rem,9vw,4.5rem);font-weight:800;letter-spacing:-.06em;font-variant-numeric:tabular-nums">10:00</div><p id="breakstatus" class="muted">Break timer running</p></div><div class="actions"><button class="primary" id="skipbreak">Skip break and continue →</button><button class="secondary" id="pausebreak">Pause break timer</button><button class="secondary" id="pauseexam">Pause entire exam</button></div></section>';
const next=()=>{stopTimer();state.currentPaper++;state.partIndex=0;state.questionIndex=0;state.remaining=papers()[state.currentPaper].minutes*60;renderPractice()};
wireExamHeader();document.getElementById('skipbreak').onclick=next;
document.getElementById('pauseexam').onclick=()=>pauseExam('break');
document.getElementById('pausebreak').onclick=()=>{if(state.running){stopTimer();document.getElementById('pausebreak').textContent='Resume break timer';document.getElementById('breakstatus').textContent='Break timer paused'}else{if(state.breakRemaining<=0)return;state.running=true;document.getElementById('pausebreak').textContent='Pause break timer';document.getElementById('breakstatus').textContent='Break timer running';startBreakClock()}};
function startBreakClock(){state.timerId=setInterval(()=>{state.breakRemaining--;const clock=document.getElementById('breakclock');if(clock)clock.textContent=fmt(state.breakRemaining);const headerClock=document.getElementById('headerClock');if(headerClock)headerClock.textContent=fmt(state.breakRemaining);if(state.breakRemaining<=0){stopTimer();next()}},1000)}
state.running=true;startBreakClock();
}
function pauseExam(screen){document.body.classList.add('exam-active');stopTimer();state.pausedScreen=screen;app.innerHTML=examHeader('--:--')+'<div class="step"><span class="dot">Ⅱ</span><b>Exam paused</b></div><section class="panel exam-workspace"><p class="eyebrow">PAUSED</p><h2>Your exam is paused</h2><p class="intro">Your current paper and remaining time have been preserved. Resume when you are ready.</p><div class="actions"><button class="primary" id="resumeexam">Resume exam →</button><button class="secondary" id="endpaused">End practice</button></div></section>';wireExamHeader();document.getElementById('resumeexam').onclick=()=>{const screen=state.pausedScreen;state.pausedScreen=null;if(screen==='break'){renderBreak(false)}else{renderPractice()}};document.getElementById('endpaused').onclick=()=>{state.started=false;renderComplete()}}
function renderComplete(){recordCompletedSession();const score=scoreCurrentRue();const report=score?'<div class="choice"><span class="symbol green">✓</span><span><strong>Reading: '+score.reading+' / 42</strong><small>Parts 1, 5, 6 and 7</small><strong>Use of English: '+score.useOfEnglish+' / 28</strong><small>Parts 2, 3 and 4</small><strong>Total: '+score.total+' / 70</strong></span></div>':'<div class="note">Answers have been saved. Detailed marking is available for the candidate Reading and Use of English tests.</div>';frame('Practice complete','You have reached the end of your selected papers.',report+'<div class="note">This is a practice raw-mark result for original candidate material, not an official Cambridge English Scale score.</div>','<div class="actions"><button class="primary" id="again">Back to summary</button><button class="secondary" id="home">Back to start</button></div>');document.getElementById('again').onclick=()=>{state.currentPaper=0;state.remaining=0;renderSummary(modes.find(m=>m.id===state.mode))};document.getElementById('home').onclick=renderHome}
renderHome();

// Part 1 fixed-position gap menus. Menus are portalled to <body> so ancestor layout cannot affect viewport coordinates.
(function(){
 let openMenu=null;
 function restore(menu){
  if(!menu||!menu._home)return;
  const home=menu._home,next=menu._next;
  if(home.isConnected){
   if(next&&next.parentNode===home)home.insertBefore(menu,next);
   else home.appendChild(menu);
  }else menu.remove();
 }
 function close(menu){
  const target=menu||openMenu;
  if(!target)return;
  target.hidden=true;
  target.style.visibility='';
  target.style.left='';
  target.style.top='';
  restore(target);
  if(openMenu===target)openMenu=null;
 }
 window.closeRueGapMenu=close;
 function place(button,menu){
  if(!menu._home){menu._home=menu.parentNode;menu._next=menu.nextSibling;}
  if(menu.parentNode!==document.body)document.body.appendChild(menu);
  menu.hidden=false;
  menu.style.position='fixed';
  menu.style.visibility='hidden';
  menu.style.maxWidth=Math.min(innerWidth-16,420)+'px';
  menu.style.left='8px';
  menu.style.top='8px';
  const r=button.getBoundingClientRect();
  let mr=menu.getBoundingClientRect();
  let left=Math.max(8,Math.min(r.left,innerWidth-mr.width-8));
  let top=r.bottom+6;
  if(top+mr.height>innerHeight-8)top=Math.max(8,r.top-mr.height-6);
  menu.style.left=Math.round(left)+'px';
  menu.style.top=Math.round(top)+'px';
  menu.style.visibility='visible';
  mr=menu.getBoundingClientRect();
  // Final viewport assertion/clamp after the real dimensions are known.
  if(mr.left<8)menu.style.left=(parseFloat(menu.style.left)+(8-mr.left))+'px';
  if(mr.right>innerWidth-8)menu.style.left=(parseFloat(menu.style.left)-(mr.right-(innerWidth-8)))+'px';
  mr=menu.getBoundingClientRect();
  if(mr.top<8)menu.style.top=(parseFloat(menu.style.top)+(8-mr.top))+'px';
  if(mr.bottom>innerHeight-8)menu.style.top=Math.max(8,parseFloat(menu.style.top)-(mr.bottom-(innerHeight-8)))+'px';
  mr=menu.getBoundingClientRect();
  const dx=Math.round(mr.left-r.left),dy=Math.round(mr.top-r.bottom);
  console.log('[RUE Part 1 menu]',button.dataset.gapOpen,{gap:{left:Math.round(r.left),top:Math.round(r.top),right:Math.round(r.right),bottom:Math.round(r.bottom)},menu:{left:Math.round(mr.left),top:Math.round(mr.top),right:Math.round(mr.right),bottom:Math.round(mr.bottom)},distance:{x:dx,y:dy},insideViewport:mr.left>=8&&mr.top>=8&&mr.right<=innerWidth-8&&mr.bottom<=innerHeight-8});
 }
 document.addEventListener('click',function(e){
  const button=e.target.closest('[data-gap-open]');
  if(button){
   const menu=document.getElementById('gapMenu'+button.dataset.gapOpen);
   if(openMenu===menu){close(menu);return}
   close();
   openMenu=menu;
   place(button,menu);
   return;
  }
  if(e.target.closest('[data-gap-value]')||e.target.closest('[data-gap-clear]'))return;
  if(openMenu&&!e.target.closest('.gap-choice-menu'))close();
 });
 document.addEventListener('scroll',function(e){
  if(!openMenu)return;
  const target=e.target;
  if(target&&target.classList&&target.classList.contains('cloze-passage'))close();
 },true);
 addEventListener('keydown',function(e){if(e.key==='Escape')close()});
})();
