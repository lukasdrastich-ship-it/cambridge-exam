/* Cambridge Digital-inspired exam interface */
body.exam-active .shell{max-width:none;padding:0 24px 40px}body.exam-active .topbar,body.exam-active .footer{display:none}.exam-header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:12px 20px;background:#fff;border:1px solid #d9dee5;border-radius:0;margin:-26px -24px 20px;box-shadow:0 2px 5px #14213a0a}
.exam-brand,.exam-identity,.exam-tools{display:flex;align-items:center;gap:14px}.exam-brand{font-family:Georgia,serif;font-size:1.05rem;color:#202a3b;white-space:nowrap}.exam-crest{font-size:1.55rem;color:#8a1c2b}.exam-product{font:600 .95rem Inter,system-ui,sans-serif;border-left:1px solid #d5dbe3;padding-left:18px}.exam-identity{border-left:1px solid #d5dbe3;padding-left:18px;color:#27344b;font-size:.9rem}.exam-identity small,.exam-time small{display:block;color:#68758a;font-size:.75rem;margin-top:2px}.exam-time{display:flex;align-items:center;gap:9px;border-left:1px solid #d5dbe3;padding-left:18px;font-variant-numeric:tabular-nums}.exam-time strong{font-size:1rem}.exam-tools{margin-left:auto}.exam-icon{border:0;background:transparent;color:#25344b;width:38px;height:38px;border-radius:5px;font-size:1.3rem;display:grid;place-items:center;position:relative}.exam-icon:hover{background:#eef2f6}.message-dot{position:absolute;width:7px;height:7px;border-radius:50%;background:#1685b8;right:7px;top:6px}.exam-menu{position:absolute;right:16px;top:calc(100% + 5px);width:min(340px,calc(100vw - 32px));background:white;border:1px solid #d7dde5;border-radius:4px;box-shadow:0 8px 24px #14213a26;padding:8px;z-index:30}.exam-menu button{width:100%;border:0;background:white;text-align:left;padding:14px 12px;color:#27344b;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e6e9ee}.exam-menu button:last-child{border-bottom:0}.exam-menu button:hover{background:#f2f5f8}.exam-submenu{padding:7px 10px 12px;border-bottom:1px solid #e6e9ee}.exam-submenu button{padding:10px;border:0;border-radius:3px}.exam-submenu button[aria-pressed=true]{background:#eaf1f8;font-weight:700}.exam-message{position:absolute;right:60px;top:calc(100% + 5px);width:min(310px,calc(100vw - 32px));background:#fff;border:1px solid #d7dde5;padding:18px;box-shadow:0 8px 24px #14213a26;z-index:30}.exam-workspace{background:#fff;border:1px solid #dfe3e8;border-radius:3px;padding:clamp(1 .task-intro{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.task-instruction{background:#f4f6f8;border:1px solid #e0e4e9;padding:14px 16px;margin:14px 0 20px;color:#344154;line-height:1.55}.task-reading{font-family:Georgia,serif;font-size:1.06rem;line-height:1.85;max-width:900px;color:#273449}.task-question{padding:15px 0;border-bottom:1px solid #e4e8ed;display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px}.task-number{border:1px solid #aeb8c4;border-radius:3px;width:28px;height:28px;display:grid;place-items:center;font-weight:700;font-size:.85rem}.task-question p{margin:0 0 10px;line-height:1.55}.task-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.task-option{border:1px solid #d9dfe6;background:#fff;text-align:left;padding:10px 12px;border-radius:3px;color:#26354a}.task-option[aria-pressed=true]{border-color:#087b96;background:#eaf5f7;color:#075e73;font-weight:700}.task-answer{width:min(100%,420px);padding:10px 12px;border:1px solid #bdc6d1;border-radius:3px;font:inherit}.task-passage{white-space:pre-line;line-height:1.8;color:#26354a;margin:18px 0}.task-passage .gap{display:inline-block;min-width:76px;border-bottom:1px solid #526174;text-align:center;font-weight:700}.task-bottom-nav{position:sticky;bottom:0;z-index:15;display:flex;align-items:stretch;gap:0;overflow-x:auto;background:#f7f8fa;border:1px solid #d8dde3;margin:24px -30px -30px;padding:0 8px;box-shadow:0 -3px 12px #17213a0a}.task-tab{flex:1;min-width:112px;position:relative;border:0;border-right:1px solid #d8dde3;background:transparent;padding:12px 10px 10px;color:#3b4657;text-align:center;font-size:.86rem;white-space:nowrap}.task-tab[aria-current=step]{background:#fff;border-top:3px solid #087b96;padding-top:9px;font-weight:750}.task-tab.done:before{content:'✓';margin-right:6px;color:#397b58}.task-tab small{display:block;color:#6a7482;font-size:.73rem;margin-top:4px}.task-tab .bookmark{position:absolute;right:9px;top:3 <body><div class="shell"><header class="topbar"><div class="brand"><div class="mark">C</div><span>Cambridge Prep</span></div><div class="top-tag">Your preparation. Your pace.</div></header><main id="app" aria-live="polite"></main><footer class="footer"><span>Cambridge Prep · Navigation prototype</span><span>An independent study aid, not affiliated with Cambridge English.</span></footer></div>
<script>
const state={level:null,mode:null,sections:new Set(),currentPaper:0,remaining:0,running:false,timerId:null,started:false,breakRemaining:600,pausedScreen:null,partIndex:0,answers:{},bookmarks:{},generatedText:{},contrast:'normal',textSize:'normal',hideTime:false,menuOpen:false,messageOpen:false};
const app=document.getElementById('app');
const modes=[
{id:'exam',icon:'⏱',tone:'',title:'Exam Simulation',tag:'Real exam feel',desc:'Follow the official exam order and time limits. You can skip scheduled breaks.',foot:'Start exam simulation'},
{id:'sections',icon:'▤',tone:'peach',title:'Practice by Section',tag:'Choose papers',desc:'Choose the exam papers you want to practise.',foot:'Choose papers'}];
const examData={
B2:[
{id:'rue',name:'Reading & Use of English',minutes:75,display:'1 hour 15 minutes',parts:['Part 1 — Multiple-choice cloze','Part 2 — Open cloze','Part 3 — Word formation','Part 4 — Key word transformations','Part 5 — Multiple choice','Part 6 — Gapped text','Part 7 — Multiple matching']},
{id:'writing',name:'Writing',minutes:80,display:'1 hour 20 minutes',parts:['Part 1 — Essay','Part 2 — Article, email/letter, report or review']},
{id:'listening',name:'Listening',minutes:40,display:'About 40 minutes',parts:['Part 1 — Multiple choice','Part 2 — Sentence completion','Part 3 — Multiple matching','Part 4 — Multiple choice']},
{id:'speaking',name:'Speaking',minutes:14,display:'14 minutes per pair',parts:['Part 1 — Interview','Part 2 — Long turn','Part 3 — Collaborative task','Part 4 — Discussion']}
]};
function papers(){return examData[state.level].filter(p=>state.mode!=='sections'||state.sections.has(p.name))}
function stopTimer(){if(state.timerId)clearInterval(state.timerId);state.timerId=null;state.running=false}

function examHeader(timeValue,label='Time remaining'){
return '<header class="exam-header"><div class="exam-brand"><span class="exam-crest">▰</span><span class="exam-wordmark">CAMBRIDGE<small>English</small></span></div><div class="exam-identity"><strong>888881</strong><small>Test taker ID</small></div><div class="exam-time"><strong id="headerClock">'+timeValue+'</strong><small>'+label+'</small></div><div class="exam-tools"><button class="exam-icon" aria-label="Connection status" title="Connection status"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 8.8a15.5 15.5 0 0 1 20 0M5 12a11 11 0 0 1 14 0m-11 3.2a6 6 0 0 1 8 0M12 19h.01"/></svg></button><button class="exam-icon" id="messageButton" aria-label="Invigilator messages" title="Invigilator messages"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></button><button class="exam-icon" id="settingsButton" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><button class="exam-icon" id="notesButton" aria-label="Notes" title="Notes"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h11l5 5v11H4zM15 4v5h5M8 15l7-7 2 2-7 7-3 1z"/></svg></button></div><div id="examPopup"></div></header>';
}function applyExamPrefs(){document.body.classList.toggle('contrast-dark',state.contrast==='dark');document.body.classList.toggle('contrast-yellow',state.contrast==='yellow');document.body.classList.toggle('text-large',state.textSize==='large');document.body.classList.toggle('text-xlarge',state.textSize==='xlarge');document.body.classList.toggle('time-hidden',state.hideTime)}
function wireExamHeader(){
const popup=document.getElementById('examPopup');
document.getElementById('settingsButton').onclick=()=>{state.menuOpen=!state.menuOpen;state.messageOpen=false;drawPopup()};

function generatedParagraph(index){
const key=state.currentPaper+'-'+index;
if(state.generatedText[key])return state.generatedText[key];
const subjects=['The organisers','Several local residents','A small team of volunteers','The project manager','Visitors from nearby towns','The research group'];

document.getElementById('nextPart').onclick=()=>{if(partIndex<p.parts.length-1){state.partIndex++;renderPractice()}else if(state.currentPaper<list.length-1){stopTimer();state.currentPaper++;state.partIndex=0;state.remaining=list[state.currentPaper].minutes*60;renderPractice()}else renderComplete()};
wireExamHeader();if(state.remaining>0){state.running=true;state.timerId=setInterval(()=>{state.remaining--;const h=document.getElementById('headerClock');if(h)h.textContent=fmt(state.remaining);if(state.remaining<=0)stopTimer()},1000)}
}function renderBreak(reset=true){document.body.classList.add('exam-active');stopTimer();if(reset)state.breakRemaining=600;app.innerHTML=examHeader(fmt(state.breakRemaining),'Break time remaining')+'<div class="step"><span class="dot">B</span><b>Scheduled break</b></div><section class="panel exam-workspace"><p class="eyebrow">EXAM SIMULATION · BREAK</p><h2>Take a break</h2><p class="intro">The previous paper is complete. A 10-minute break is available before the next paper. Skip it whenever you are ready.</p><div style="text-align:center;background:#f5f6fb;border-radius:18px;padding:24px;margin:22px 0"><div class="muted" style="font-size:.85rem;margin-bottom:8px">BREAK TIME REMAINING</div><div id="breakclock" style="font-size:clamp(2.8rem,9vw,4.5rem);font-weight:800;letter-spacing:-.06em;font-variant-numeric:tabular-nums">10:00</div><p id="breakstatus" class="muted">Break timer running</p></div><div class="actions"><button class="primary" id="skipbreak">Skip break and continue →</button><button class="secondary" id="pausebreak">Pause break timer</button><button class="secondary" id="pauseexam">Pause entire exam</button></div></section>';
const next=()=>{stopTimer();state.currentPaper++;state.partIndex=0;state.remaining=papers()[state.currentPaper].minutes*60;renderPractice()};
wireExamHeader();document.getElementById('skipbreak').onclick=next;
document.getElementById('pauseexam').onclick=()=>pauseExam('break');
document.getElementById('pausebreak').onclick=()=>{if(state.running){stopTimer();document.getElementById('pausebreak').textContent='Resume break timer';document.getElementById('breakstatus').textContent='Break timer paused'}else{if(state.breakRemaining<=0)return;state.running=true;document.getElementById('pausebreak').textContent='Pause break timer';document.getElementById('breakstatus').textContent='Break timer running';startBreakClock()}};
function startBreakClock(){state.timerId=setInterval(()=>{state.breakRemaining--;const clock=document.getElementById('breakclock');if(clock)clock.textContent=fmt(state.breakRemaining);const headerClock=document.getElementById('headerClock');if(headerClock)headerClock.textContent=fmt(state.breakRemaining);if(state.breakRemaining<=0){stopTimer();next()}},1000)}
state.running=true;startBreakClock();
}
function pauseExam(screen){document.body.classList.add('exam-active');stopTimer();state.pausedScreen=screen;app.innerHTML=examHeader('--:--')+'<div class="step"><span class="dot">Ⅱ</span><b>Exam paused</b></div><section class="panel exam-workspace"><p class="eyebrow">PAUSED</p><h2>Your exam is paused</h2><p class="intro">Your current paper and remaining time have been preserved. Resume when you are ready.</p><div class="actions"><button class="primary" id="resumeexam">Resume exam →</button><button class="secondary" id="endpaused">End practice</button></div></section>';wireExamHeader();document.getElementById('resumeexam').onclick=()=>{const screen=state.pausedScreen;state.pausedScreen=null;if(screen==='break'){renderBreak(false)}else{renderPractice()}};document.getElementById('endpaused').onclick=()=>{state.started=false;renderComplete()}}
function renderComplete(){frame('Practice complete','You have reached the end of your selected papers.','<div class="note">This prototype includes paper names, part names and countdown timers. Exam questions and saved results have not been added.</div>','<div class="actions"><button class="primary" id="again">Back to summary</button><button class="secondary" id="home">Back to start</button></div>');document.getElementById('again').onclick=()=>{state.currentPaper=0;state.remaining=0;renderSummary(modes.find(m=>m.id===state.mode))};document.getElementById('home').onclick=renderHome}
renderHome();
</script></body></html>
