<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f7fb">
<title>Cambridge Prep — exam preparation</title>
<style>
:root{--ink:#17213a;--muted:#68738b;--line:#e2e7f0;--paper:#fff;--bg:#f6f7fb;--blue:#3858d6;--shadow:0 18px 55px #1a285214}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 8% 0%,#e9edff 0,transparent 34%),var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);min-height:100vh}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #8da0ff;outline-offset:3px}.shell{max-width:1100px;margin:auto;padding:26px 24px 48px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:58px}.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.04em}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--blue);color:white}.top-tag,.muted{color:var(--muted)}.hero{max-width:760px;margin-bottom:34px}.eyebrow{font-size:.76rem;text-transform:uppercase;letter-spacing:.15em;color:var(--blue);font-weight:800;margin:0 0 13px}.hero h1{font-size:clamp(2.4rem,6vw,4.4rem);line-height:1.03;letter-spacing:-.065em;margin:0 0 17px}.hero h1 span{color:var(--blue)}.hero p:last-child{font-size:1.07rem;line-height:1.7;color:var(--muted);max-width:630px;margin:0}.step{display:flex;align-items:center;gap:10px;margin:0 0 17px;color:var(--muted);font-size:.88rem}.step b{color:var(--ink)}.dot{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:white;border:1px solid var(--line);border-radius:22px;padding:25px;text-align:left;display:flex;flex-direction:column;min-height:215px;color:inherit;transition:.18s;box-shadow:0 2px 0 #17213a03}.card:hover{transform:translateY(-3px);border-color:#aab7f5;box-shadow:var(--shadow)}.cardhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:12px}.symbol{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:#e5ebff;font-size:1.2rem;font-weight:800}.symbol.green{background:#dff7ee}.symbol.peach{background:#fff0e5}.pill{font-size:.72rem;font-weight:800;padding:7px 10px;border-radius:99px;background:#f0f2f8;color:#59647b}.card h2{font-size:1.27rem;letter-spacing:-.035em;margin:0 0 9px}.card p{font-size:.93rem;line-height:1.6;color:var(--muted);margin:0 0 19px}.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:var(--blue);font-size:.9rem;font-weight:750}.panel{background:white;border:1px solid var(--line);border-radius:22px;padding:clamp(22px,4vw,36px);box-shadow:var(--shadow);max-width:850px}.panel h2{font-size:clamp(1.6rem,3vw,2.2rem);letter-spacing:-.05em;margin:0 0 10px}.intro{color:var(--muted);line-height:1.65;margin:0 0 25px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:25px}.primary,.secondary{border:0;border-radius:12px;padding:13px 18px;font-weight:750}.primary{background:var(--blue);color:white}.primary:hover{background:#2844b5}.secondary{background:#f0f2f8;color:var(--ink)}.choices{display:grid;gap:12px}.choice{display:flex;align-items:flex-start;gap:13px;border:1px solid var(--line);border-radius:14px;padding:16px}.choice input{margin-top:5px;accent-color:var(--blue)}.choice strong{display:block;margin-bottom:5px}.choice small{display:block;color:var(--muted);line-height:1.5;font-size:.88rem}.note{padding:15px 17px;background:#f3f5ff;border-radius:13px;color:#4d5b82;font-size:.9rem;line-height:1.55;margin-top:18px}.sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.section{border:1px solid var(--line);border-radius:12px;padding:13px;background:white;color:var(--ink);text-align:left}.section[aria-pressed=true]{border-color:var(--blue);background:#f1f3ff;color:var(--blue);font-weight:750}.footer{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);margin-top:54px;padding-top:20px;color:var(--muted);font-size:.82rem}
@media(max-width:650px){.shell{padding:18px 16px 34px}.topbar{margin-bottom:40px}.top-tag{display:none}.cards,.sections{grid-template-columns:1fr}.card{min-height:190px}.footer{flex-direction:column}.hero h1{font-size:2.75rem}}
</style></head>
<body><div class="shell"><header class="topbar"><div class="brand"><div class="mark">C</div><span>Cambridge Prep</span></div><div class="top-tag">Your preparation. Your pace.</div></header><main id="app" aria-live="polite"></main><footer class="footer"><span>Cambridge Prep · Navigation prototype</span><span>An independent study aid, not affiliated with Cambridge English.</span></footer></div>
<script>
const state={level:null,mode:null,sections:new Set()};const app=document.getElementById('app');
const modes=[
{id:'exam',icon:'⏱',tone:'',title:'Exam Simulation',tag:'Real exam feel',desc:'Follow the official exam order and time limits. You can skip scheduled breaks.',foot:'Start exam simulation'},
{id:'flex',icon:'Ⅱ',tone:'green',title:'Flexible Practice',tag:'Your own pace',desc:'Stop after a section and return later. Take a break at any time, even in the middle of a section.',foot:'Start flexible practice'},
{id:'sections',icon:'▤',tone:'peach',title:'Practice by Section',tag:'Choose sections',desc:'Focus on a specific exam paper or task type you want to practise.',foot:'Choose sections'}];
function renderHome(){app.innerHTML='<section class="hero"><p class="eyebrow">Prepare with purpose</p><h1>Your next level of English<br>starts <span>here.</span></h1><p>Choose your Cambridge exam and the preparation style that works for you. Get started with a clear plan and learn at your own pace.</p></section><div class="step"><span class="dot">1</span><b>Choose your exam level</b></div><div class="cards"><button class="card" data-level="B2"><div class="cardhead"><span class="symbol">B2</span><span class="pill">Upper-intermediate</span></div><h2>B2 First (FCE)</h2><p>Show that you can use English confidently in everyday situations, study and work.</p><div class="foot"><span>Choose B2 First</span><span>↗</span></div></button><button class="card" data-level="C1"><div class="cardhead"><span class="symbol">C1</span><span class="pill">Advanced</span></div><h2>C1 Advanced (CAE)</h2><p>Demonstrate advanced English skills for demanding academic and professional situations.</p><div class="foot"><span>Choose C1 Advanced</span><span>↗</span></div></button></div>';app.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{state.level=b.dataset.level;renderModes()})}
function renderModes(){app.innerHTML='<section class="hero"><p class="eyebrow">Step 2 · '+(state.level==='B2'?'B2 First (FCE)':'C1 Advanced (CAE)')+'</p><h1>How would you like to <span>practise?</span></h1><p>Choose a mode. You can come back and change it at any time.</p></section><div class="cards">'+modes.map(m=>'<button class="card" data-mode="'+m.id+'"><div class="cardhead"><span class="symbol '+m.tone+'">'+m.icon+'</span><span class="pill">'+m.tag+'</span></div><h2>'+m.title+'</h2><p>'+m.desc+'</p><div class="foot"><span>'+m.foot+'</span><span>↗</span></div></button>').join('')+'</div><div class="actions"><button class="secondary" id="back">← Back to exam level</button></div>';app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;renderDetail()});document.getElementById('back').onclick=renderHome}
function frame(title,subtitle,body,actions){app.innerHTML='<div class="step"><span class="dot">3</span><b>'+title+'</b></div><section class="panel"><h2>'+title+'</h2><p class="intro">'+subtitle+'</p>'+body+actions+'</section>'}
function renderDetail(){const mode=modes.find(m=>m.id===state.mode);let body='';
if(state.mode==='exam')body='<div class="choices"><label class="choice"><input type="checkbox" id="skip"><span><strong>Skip scheduled breaks</strong><small>Move straight to the next section when you finish. Time limits for each section remain unchanged.</small></span></label></div><div class="note">The full simulation will follow the selected exam’s order and time limits. Test questions are not included in this prototype yet.</div>';
else if(state.mode==='flex')body='<div class="choices"><div class="choice"><span class="symbol green">Ⅱ</span><span><strong>Take a break anytime</strong><small>Pause even in the middle of a section and resume where you left off.</small></span></div><div class="choice"><span class="symbol">↻</span><span><strong>Resume later</strong><small>Your progress and answers can be saved and restored in a future version.</small></span></div></div><div class="note">Breaks and saving are planned features. A working timer and progress saving will be added later.</div>';
else body='<p style="margin:0 0 14px;font-weight:750">Which sections would you like to practise?</p><div class="sections">'+['Reading','Use of English','Writing','Listening','Speaking'].map(s=>'<button class="section" data-section="'+s+'" aria-pressed="'+state.sections.has(s)+'">'+(state.sections.has(s)?'✓ ':'')+s+'</button>').join('')+'</div><div class="note">Choose one or more sections. Specific practice tasks will be added later.</div>';
frame(mode.title,'Selected exam: '+(state.level==='B2'?'B2 First (FCE)':'C1 Advanced (CAE)'),body,'<div class="actions"><button class="primary" id="continue">'+(state.mode==='sections'?'Confirm selection':'Set up this mode')+' →</button><button class="secondary" id="back">← Back to modes</button></div>');
app.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{const s=b.dataset.section;state.sections.has(s)?state.sections.delete(s):state.sections.add(s);renderDetail()});document.getElementById('back').onclick=renderModes;document.getElementById('continue').onclick=()=>renderSummary(mode)}
function renderSummary(mode){let detail='';if(state.mode==='sections'){if(!state.sections.size)detail='<p class="intro">You haven’t selected any sections yet. Go back and choose at least one.</p>';else detail='<p class="intro">Selected sections: '+[...state.sections].join(', ')+'.</p>'}else if(state.mode==='exam')detail='<p class="intro">Scheduled breaks: '+(document.getElementById('skip')?.checked?'skip.':'keep.')+' Section time limits will remain unchanged.</p>';else detail='<p class="intro">This mode is designed for a flexible pace and breaks at any point during a section.</p>';
frame('Your practice is ready','Your setup for '+(state.level==='B2'?'B2 First (FCE)':'C1 Advanced (CAE)')+' .','<div class="choices"><div class="choice"><span class="symbol">'+state.level+'</span><span><strong>'+(state.level==='B2'?'B2 First (FCE)':'C1 Advanced (CAE)')+'</strong><small>Selected exam level</small></span></div><div class="choice"><span class="symbol green">'+mode.icon+'</span><span><strong>'+mode.title+'</strong><small>Selected practice mode</small></span></div></div>'+detail+'<div class="note">This is a navigation prototype without test questions. Next, we can add the timer, progress saving and exam content.</div>','<div class="actions"><button class="primary" id="home">Back to start</button><button class="secondary" id="change">Change mode</button></div>');
document.getElementById('home').onclick=()=>{state.level=null;state.mode=null;state.sections.clear();renderHome()};document.getElementById('change').onclick=renderModes}
renderHome();
</script></body></html>
